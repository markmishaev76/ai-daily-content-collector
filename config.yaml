# Story of the day (src/story.py). Section weights are the `weight:` on each topic above.
# Entries are a host (subdomains match too) or host/path-prefix.
story:
  source_tiers:
    primary:
      - "datatracker.ietf.org"
      - "ietf.org"
      - "rfc-editor.org"
      - "nist.gov"
      - "cisa.gov"
      - "github.blog"
      - "about.gitlab.com"
      - "blog.cloudflare.com"
      - "openai.com"
      - "anthropic.com"
      - "aws.amazon.com/blogs/security"
      - "auth0.com"
      - "okta.com"
      - "openid.net"
      - "openssf.org"
      - "slsa.dev"
      - "sigstore.dev"
      - "kubernetes.io"
      - "blog.modelcontextprotocol.io"
    aggregator:
      - "news.ycombinator.com"
      - "hnrss.org"
      - "reddit.com"
  # A story covered only by Hacker News items needs this many points on its best item to lead.
  lead_min_hn_points: 50
  # Hacker News items need this many points to appear in the sections (site and email).
  section_min_hn_points: 10
  # The lead uses a picture from one of these when its story cluster has one (vendor blog images are often screenshots).
  news_outlets:
    - "thehackernews.com"
    - "securityweek.com"
    - "theregister.com"
    - "bleepingcomputer.com"
    - "darkreading.com"
    - "therecord.media"
    - "krebsonsecurity.com"
    - "arstechnica.com"
    - "techcrunch.com"
    - "theverge.com"
    - "wired.com"
    - "zdnet.com"
    - "infoq.com"
    - "technologyreview.com"
    - "spectrum.ieee.org"

# The Pulse (src/pulse.py): top Reddit threads of the last 24 hours, shown under the story of the day (site only).
pulse:
  min_upvotes: 100
  limit: 10
  max_age_hours: 24
  subreddits:
    # A small sub: its best daily threads rarely reach 100 upvotes.
    - name: "EngineeringManagers"
      min_upvotes: 25
    - "ClaudeAI"
    - "cybersecurity"
    - "ChatGPTCoding"
    - "cursor"

brief:
  max_articles_per_topic: 8
  
# Email settings
# Note: Email credentials are configured via environment variables in .env
# EMAIL_FROM, EMAIL_TO, EMAIL_PASSWORD
email:
  subject: "Your Morning Brief - {date}"
  include_links: true
  group_by_category: true


