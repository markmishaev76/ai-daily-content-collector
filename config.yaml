# Story of the day (src/story.py). Section weights are the `weight:` on each topic above.
# Entries are a host (subdomains match too) or host/path-prefix.
story:
  source_tiers:
    primary:
      - "datatracker.ietf.org"
      - "ietf.org"
      - "rfc-editor.org"
      - "nist.gov"
      - "cisa.gov"
      - "github.blog"
      - "about.gitlab.com"
      - "blog.cloudflare.com"
      - "openai.com"
      - "anthropic.com"
      - "aws.amazon.com/blogs/security"
      - "auth0.com"
      - "okta.com"
      - "openid.net"
      - "openssf.org"
      - "slsa.dev"
      - "sigstore.dev"
      - "kubernetes.io"
      - "blog.modelcontextprotocol.io"
    aggregator:
      - "news.ycombinator.com"
      - "hnrss.org"
      - "reddit.com"
  # A story covered only by Hacker News items needs this many points on its best item to lead.
  lead_min_hn_points: 50
  # Hacker News items need this many points to appear in the sections (site and email).
  section_min_hn_points: 10
  # The lead uses a picture from one of these when its story cluster has one (vendor blog images are often screenshots).
  news_outlets:
    - "thehackernews.com"
    - "securityweek.com"
    - "theregister.com"
    - "bleepingcomputer.com"
    - "darkreading.com"
    - "therecord.media"
    - "krebsonsecurity.com"
    - "arstechnica.com"
    - "techcrunch.com"
    - "theverge.com"
    - "wired.com"
    - "zdnet.com"
    - "infoq.com"
    - "technologyreview.com"
    - "spectrum.ieee.org"

# The Pulse (src/pulse.py): the most-discussed threads of the last 24 hours on Hacker News, Lobsters and
# Reddit, shown under the story of the day (site only). Ranked by points over each source's threshold.
pulse:
  limit: 10
  max_age_hours: 24
  # Hacker News and Lobsters posts must be on topic: a Lobsters tag below, a main.AX_THEME_KEYWORDS hit,
  # a CVE/breach title, a story.source_tiers primary link, or one of these whole words in the title.
  keywords:
    - "ai"
    - "llm"
    - "llms"
    - "agent"
    - "agents"
    - "chatgpt"
    - "openai"
    - "anthropic"
    - "claude"
    - "gemini"
    - "security"
    - "vulnerability"
    - "vulnerabilities"
    - "exploit"
    - "rce"
    - "cve"
    - "malware"
    - "phishing"
    - "backdoor"
    - "hacker"
    - "hackers"
    - "hacked"
    - "leaks"
    - "cyber"
    - "cybersecurity"
    - "oauth"
    - "passkeys"
    - "authentication"
    - "kubernetes"
    - "devops"
    - "outage"
    - "engineering manager"
    - "engineering managers"
    - "engineering management"
  hacker_news:
    min_points: 100
  lobsters:
    # Lobsters scores run far below Hacker News: 15 is about the top quarter of a day's stories.
    min_score: 15
    tags: ["ai", "ai-tooling", "vibecoding", "ml", "security", "cryptography", "devops", "practices", "scaling"]
  # Reddit is read only when it answers: GitHub runners get 403 without REDDIT_CLIENT_ID/SECRET.
  min_upvotes: 100
  subreddits:
    # A small sub: its best daily threads rarely reach 100 upvotes.
    - name: "EngineeringManagers"
      min_upvotes: 25
    - "ClaudeAI"
    - "cybersecurity"
    - "ChatGPTCoding"
    - "cursor"

# Learn (src/learn.py): popular recent YouTube videos on /learn/ and a front-page teaser (site only).
# Ranked by views per day; Shorts and 0-view premieres are skipped. Ids come from each channel's page.
# The grid takes at most per_channel from one channel, then fills open slots with the next best from any.
learn:
  max_age_days: 30
  per_channel: 2
  limit: 6
  recent_per_channel: 5
  channels:
    - name: "AI Engineer"
      handle: "@aiDotEngineer"
      id: "UCLKPca3kwwd-B59HNr-_lvA"
    - name: "Anthropic"
      handle: "@anthropic-ai"
      id: "UCrDwWp7EBBv4NwvScIpBDOA"
    - name: "The Pragmatic Engineer"
      handle: "@pragmaticengineer"
      id: "UCPbwhExawYrn9xxI21TFfyw"

# Events (src/events.py): open calls for talks and conferences on /events/, a CFP strip on the front page,
# and /events/cfps.ics (site only). A conference is kept when its name has a keyword below (whole words,
# any case) or it comes from a conference-data topic file listed under topic_categories.
events:
  horizon_days: 90
  closing_days: 7
  topics: ["security", "devops", "sre", "leadership", "general", "opensource", "python", "api", "data"]
  topic_categories:
    security: "security"
    devops: "platform"
    sre: "platform"
    leadership: "leadership"
  keywords:
    ai: ["AI", "LLM", "LLMs", "GenAI", "agent", "agents", "agentic", "MCP", "ML", "machine learning"]
    security: ["security", "AppSec", "DevSecOps", "OWASP", "BSides", "DEF CON", "DEFCON", "Black Hat", "cyber",
               "infosec", "identity", "IAM", "OAuth", "Identiverse"]
    platform: ["DevOps", "DevOpsDays", "platform engineering", "cloud", "cloud native", "Kubernetes", "KubeCon", "SRE", "SREcon",
               "observability", "infrastructure"]
    leadership: ["leadership", "LeadDev", "engineering management", "CTO", "StaffPlus"]

# Email signup (site only): a Buttondown username shows the form on the front page and About; blank hides it.
# Buttondown's RSS-to-email automation sends each morning's issue from https://thedailybrief.dev/brief.xml.
newsletter:
  buttondown: "thedailybrief"

brief:
  max_articles_per_topic: 8
  
# Email settings
# Note: Email credentials are configured via environment variables in .env
# EMAIL_FROM, EMAIL_TO, EMAIL_PASSWORD
email:
  subject: "Your Morning Brief - {date}"
  include_links: true
  group_by_category: true


