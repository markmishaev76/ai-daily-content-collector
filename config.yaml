# Shown in every brief (after overview): bookmark-style links, not RSS
cursor_resources:
  enabled: true
  title: "Cursor — quick references"
  intro: "Official docs and community entry points. Pair with the news section below for daily updates."
  links:
    - label: "Documentation"
      url: "https://cursor.com/docs"
    - label: "Changelog"
      url: "https://cursor.com/changelog"
    - label: "Blog (product & research)"
      url: "https://cursor.com/blog"
    - label: "Community forum"
      url: "https://forum.cursor.com/"
    - label: "Community hub (Discord, events)"
      url: "https://cursor.com/community"
    - label: "Agent best practices (official)"
      url: "https://cursor.com/blog/agent-best-practices"
    - label: "Rules for AI (.cursor/rules)"
      url: "https://cursor.com/docs/rules"
    - label: "MCP (Model Context Protocol)"
      url: "https://cursor.com/docs/mcp"
    - label: "Agent overview"
      url: "https://cursor.com/docs/agent/overview"

# Summarization settings
summarization:
  model: "claude-sonnet-4-20250514"  # Latest Claude Sonnet model
  max_articles_per_topic: 5
  summary_length: "brief"  # brief, medium, or detailed
  
# Email settings
# Note: Email credentials are configured via environment variables in .env
# EMAIL_FROM, EMAIL_TO, EMAIL_PASSWORD
email:
  subject: "Your Morning Brief - {date}"
  include_links: true
  group_by_category: true


