# Summarization settings
summarization:
  model: "claude-sonnet-4-20250514"  # Latest Claude Sonnet model
  max_articles_per_topic: 5
  summary_length: "brief"  # brief, medium, or detailed
  
# Email settings
# Note: Email credentials are configured via environment variables in .env
# EMAIL_FROM, EMAIL_TO, EMAIL_PASSWORD
email:
  subject: "Your Morning Brief - {date}"
  include_links: true
  group_by_category: true


