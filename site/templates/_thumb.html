{% macro thumb(item, color, cls="thumb") %}
<div class="{{ cls }}" style="--c: {{ color }}">
  <span class="thumb-label">{{ item.source }}</span>
  {% if item.image %}<img src="{{ item.image }}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">{% endif %}
</div>
{% endmacro %}

{% macro title(item) %}
{% if item.link %}<a href="{{ item.link }}" rel="noopener noreferrer">{{ item.title }}</a>{% else %}{{ item.title }}{% endif %}
{% endmacro %}
