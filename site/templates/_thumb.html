{% macro thumb(item, color, cls="thumb") %}
<div class="{{ cls }}" style="--c: {{ color }}">
  {% if item.image %}
  <span class="thumb-label">{{ item.source }}</span>
  <img src="{{ item.image }}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">
  {% else %}
  <span class="tile-mark">
    {% if item.icon %}<img class="logo" src="{{ item.icon }}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">{% endif %}
    <span class="tile-domain">{{ item.domain or item.source }}</span>
  </span>
  {% endif %}
</div>
{% endmacro %}

{% macro title(item) %}
{% if item.link %}<a href="{{ item.link }}" target="_blank" rel="noopener noreferrer">{{ item.title }}</a>{% else %}{{ item.title }}{% endif %}
{% endmacro %}
