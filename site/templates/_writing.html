<aside class="writing">
  <h3>Writing</h3>
  {% for post in writing %}
  <div class="writing-item">
    <a href="{{ post_href(post, root) }}">{{ post.title }}</a>
    <div class="meta">
      {% if post.source == "medium" %}<span class="label">on Medium</span>{% endif %}
      {% if post.date %}{{ post.date }}{% endif %}
    </div>
  </div>
  {% else %}
  <p class="meta">No posts yet.</p>
  {% endfor %}
  <a class="more" href="{{ root }}blog/">All posts →</a>
</aside>
