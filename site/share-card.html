<!DOCTYPE html>
<!-- Source for static/share.png. Regenerate with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
       --window-size=1200,627 --screenshot=site/static/share.png site/share-card.html -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 627px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    background: radial-gradient(circle at 85% 15%, #8f5be8 0, transparent 45%),
                linear-gradient(135deg, #2b2370 0%, #5a4fcf 55%, #7b3fb8 100%);
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 64px 72px; box-sizing: border-box;
  }
  .kicker { font-size: 26px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; opacity: .8; }
  h1 { font-size: 104px; line-height: 1; margin: 18px 0 22px; font-weight: 800; letter-spacing: -.02em; }
  p { font-size: 34px; line-height: 1.3; margin: 0; max-width: 900px; opacity: .92; }
  .chips { display: flex; flex-wrap: wrap; gap: 12px; }
  .chip { font-size: 22px; font-weight: 600; padding: 8px 18px; border-radius: 999px; background: rgba(255,255,255,.16); }
  .foot { display: flex; justify-content: space-between; align-items: flex-end; }
  .url { font-size: 28px; font-weight: 700; }
</style>
</head>
<body>
  <div>
    <div class="kicker">Every morning</div>
    <h1>The Daily Brief</h1>
    <p>Security and AI engineering news from 120+ sources, ranked and grouped into 8 sections.</p>
  </div>
  <div class="foot">
    <div class="chips">
      <span class="chip">Agent identity</span>
      <span class="chip">AI security</span>
      <span class="chip">AppSec</span>
      <span class="chip">Supply chain</span>
      <span class="chip">Platform</span>
    </div>
    <div class="url">thedailybrief.dev</div>
  </div>
</body>
</html>
